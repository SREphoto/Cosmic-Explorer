<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cosmic Explorer</title>
    <style>
      /* Pre-mount fallback: the page must never appear blank white. */
      html, body { margin: 0; padding: 0; background: #020617; }
      #root:not(:has(*)), #root:empty { min-height: 100vh; }
      .boot-fallback {
        min-height: 100vh; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px;
        background: radial-gradient(circle at 50% 30%, #0f172a, #020617);
        color: #e2e8f0; font-family: system-ui, sans-serif; text-align: center;
      }
      .boot-fallback .orb {
        width: 84px; height: 84px; border-radius: 50%;
        background: radial-gradient(circle at 32% 30%, #34d399, #0d4531 70%);
        box-shadow: 0 0 48px rgba(52, 211, 153, 0.35);
        animation: bootPulse 1.6s ease-in-out infinite;
      }
      @keyframes bootPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
      .boot-fallback h1 { font-size: 20px; margin: 0; letter-spacing: 2px; }
      .boot-fallback p { font-size: 12px; color: #64748b; margin: 0; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-fallback">
        <div class="orb"></div>
        <h1>COSMIC EXPLORER</h1>
        <p>Waking your home planet…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
